<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- W131: iOS PWA 完整化 - viewport-fit=cover (env(safe-area-inset-*)) + interactive-widget=resizes-content (移动键盘不遮挡) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- W131: theme-color 跟随暗色 (CSS 切) -->
    <meta name="theme-color" content="#16a34a" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0a09" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="句刻 - 即时英语学习。让英语在你想用的时候就能用上。" />
    <!-- W131: iOS PWA 完整化 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="句刻" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="句刻" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- W131: 完整 icon 集 -->
    <link rel="icon" type="image/png" sizes="72x72" href="/icons/pwa-72.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/icons/pwa-96.png" />
    <link rel="icon" type="image/png" sizes="128x128" href="/icons/pwa-128.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/pwa-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/pwa-512.png" />
    <link rel="icon" type="image/svg+xml" href="/icons/pwa.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <!-- W131: iOS 启动画面 (iPhone 各种机型) -->
    <link rel="apple-touch-startup-image" href="/icons/splash-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/icons/splash-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/icons/splash-1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/icons/splash-1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/icons/splash-1242x2688.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/icons/splash-750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)" />
    <link rel="apple-touch-startup-image" href="/icons/splash-2048x2732.png" media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2)" />

    <!-- W136: LCP 关键资源 preload — 字体 woff2 (4 个 weight 400/500, 2 family latin) -->
    <!-- 业务: 首屏 LCP 元素是 "首页标题" / "首句" 文字, 字体阻塞渲染. 不 preload 等 @fontsource CSS @import 拉 woff2, FOUT. -->
    <!-- 路径: 字体走 base=/english-app/, 用绝对路径加 /english-app/ 前缀 -->
    <!-- crossorigin: woff2 字体必须 anonymous (服务器会发 CORS header, 否则 onload/onerror 不触发) -->
    <!-- 删 W135 占位 (PWA-192 precache 已覆盖, manifest 同源无需 crossorigin) -->
    <link rel="preload" href="/english-app/assets/outfit-latin-400-normal-BGsTXAXT.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    <link rel="preload" href="/english-app/assets/outfit-latin-500-normal-DKnIMDSk.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    <link rel="preload" href="/english-app/assets/jetbrains-mono-latin-400-normal-V6pRDFza.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    <link rel="preload" href="/english-app/assets/jetbrains-mono-latin-500-normal-BWZEU5yA.woff2" as="font" type="font/woff2" crossorigin="anonymous" />

    <title>句刻 - 即时英语学习</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
